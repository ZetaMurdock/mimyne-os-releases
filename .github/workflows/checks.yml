# Checks every pull request that touches the site: it must build, and the
# browser tests in web/e2e must pass against the Firestore rules on the app
# repository's main branch, which are the live ones (that repository deploys
# them when they reach main). A site change that needs rules which aren't
# live yet fails here instead of on mimyne.com.
#
# Reading the app repository takes one secret, APP_REPO_TOKEN: a fine-grained
# GitHub token with read access to the contents of ZetaMurdock/mimyne-os.
name: Site checks

on:
  pull_request:
    paths: ['web/**', '.github/workflows/checks.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_SOCIAL: 'true'

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check for the app repository token
        env:
          TOKEN: ${{ secrets.APP_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::The APP_REPO_TOKEN secret isn't set, so the tests can't read the Firestore rules from ZetaMurdock/mimyne-os. See web/e2e/README.md."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: ZetaMurdock/mimyne-os
          ref: main
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: mimyne-os
          sparse-checkout: |
            firestore.rules
            firestore.indexes.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The Firebase emulators run on Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: web
      - run: npm install -g firebase-tools@15
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
        env:
          CI: 'true'
          MIMYNE_OS_DIR: ${{ github.workspace }}/mimyne-os
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
